name: Build SUSFS KO
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version (e.g. 6.1.145)"
        required: true
        default: "6.1.145"
      kallsyms_file:
        description: "Kallsyms file name in repo root"
        required: true
        default: "kallsyms.txt"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu bison flex libssl-dev bc

      - name: Prepare build environment
        run: |
          # 复制kallsyms到源码目录
          cp ${{ github.workspace }}/${{ inputs.kallsyms_file }} susfs/susfs4ksu-gki-android14-6.1/kallsyms.txt
          # 给构建脚本执行权限
          chmod +x susfs/susfs4ksu-gki-android14-6.1/build_ksu_susfs_tool.sh

      - name: Build susfs.ko
        run: |
          cd susfs/susfs4ksu-gki-android14-6.1
          ./build_ksu_susfs_tool.sh KERNEL_VERSION=${{ inputs.kernel_version }} KALLSYMS=kallsyms.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs-ko
          path: "**/susfs.ko"
